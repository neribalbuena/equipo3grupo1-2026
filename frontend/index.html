<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tótem Escolar - Reporte de Fallas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Tótem Escolar - Reportes</h1>
        <button id="btn-theme" class="btn-theme">🌙 Modo Oscuro</button>
    </header>

    <main class="container">
        <!-- VISTA DEL TÓTEM (PÚBLICA) -->
        <section class="card">
            <h2>Reportar Falla o Rota</h2>
            <p>Seleccioná el tipo de elemento e ingresá la descripción del problema.</p>

            <form id="form-ticket">
                <label for="ubicacion">Tipo de Elemento:</label>
                <select id="ubicacion" required>
                    <option value="Notebook / Equipo">Notebook / Equipo</option>
                    <option value="Tótem Principal">Tótem Principal</option>
                    <option value="Proyector / Aula">Proyector / Aula</option>
                    <option value="Libro / Biblioteca">Proyector / Aula</option>
                    <option value="Mapa">Proyector / Aula</option>
                </select>

                <label for="descripcion">Descripcion de la falla:</label>
                <textarea id="descripcion" placeholder="Ej: Pantalla rota, compu bloqueada, etc." required></textarea>

                <button type="submit" class="btn-primary">Guardar Reporte</button>
            </form>
        </section>

        <!-- LISTADO PÚBLICO DE REPORTES -->
        <section class="card">
            <h2>Elementos Rotos o Reportados</h2>
            <div id="contenedor-tickets">
                <p style="color: #888;">Cargando reportes...</p>
            </div>
        </section>

        <!-- SECCIÓN DE LOGIN DE ADMINISTRADOR -->
        <section id="seccion-login" class="card">
            <h2>Acceso Administrador</h2>
            <form id="form-login">
                <input type="text" id="login-user" placeholder="Usuario de administrador" required />
                <input type="password" id="login-pass" placeholder="Contraseña de administrador" required />
                <button type="submit" class="btn-secondary">Ingresar como Admin</button>
            </form>
        </section>

        <!-- PANEL DE CONTROL ADMIN (OCULTO POR DEFECTO) -->
        <section id="panel-admin" class="card" style="display: none;">
            <div class="admin-header">
                <h2>Panel de Control Técnico</h2>
                <button id="btn-logout" class="btn-danger">Cerrar Sesión</button>
            </div>
            <p>Desde acá podés cambiar el estado de los reportes:</p>
            <div id="contenedor-admin-tickets"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
