<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda - Tótem Técnico</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <main class="contenedor-totem">
        <header class="encabezado">
            <h1>Mesa de Ayuda Técnica</h1>
            <p>¿Alguna netbook tiene una falla? Reportala acá para poder revisarla.</p>
        </header>

        <section class="tarjeta-formulario">
            <form id="form-ticket">
                <div class="campo-grupo">
                    <label for="descripcion">Describí el problema detalladamente:</label>
                    <textarea 
                        id="descripcion" 
                        name="descripcion" 
                        placeholder="Ej: Netbook 5 de jefatura bloqueada o no conecta a Wi-Fi..." 
                        required></textarea>
                </div>
                
                <button type="submit" class="btn-enviar">
                    <span>Enviar Reporte</span>
                </button>
            </form>
        </section>
    </main>

</body>
</html>
