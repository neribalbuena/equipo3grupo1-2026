<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor-totem">
        <header class="encabezado">
            <h1> Mesa de ayuda técnica</h1>
            <p>¿Alguna netbook tiene una falla? Reportála acá para poder revisarla.</p>

        </header>
        <main class="tarjeta-formulario">
            <form id="form-ticket">
                <div class="campo-grupo">
                    <label for="descripcion"> Describí el problema detalladamente:</label>
                    <textarea
                    id="descripcion"
                    name="descripcion"
                    placeholder="Ej: Netbook 5 de jefatura bloqueada o no conecta WI-FI..." required></textarea>
                </div>
                <button type="submit" class="btn-enviar"> Enviar Reporte</button>
            </form>
        </main>
        <footer class="pie-pagina">
            <p> Terminal de reportes - Equipo 3</p>
        </footer>
    </div>
    
</body>
</html>
