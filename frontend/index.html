<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Fallas - Tótem Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Reportar Falla en Equipo</h2>
        <p>Ingresá la descripción del problema detectado en el equipo.</p>
        
        <form id="form-ticket">
            <div class="form-group">
                <label for="descripcion">Descripción de la falla:</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Ej: La notebook no enciende o la pantalla parpadea..." required></textarea>
            </div>
            <button type="submit" class="btn-enviar">Enviar Reporte</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
